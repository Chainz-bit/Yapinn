name: yappin
description: "Yappin — aplikasi chat room realtime (Flutter + Firebase)."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Sengaja dibuat longgar supaya jalan di Flutter 3.47 (Dart 3.13) maupun 3.50.
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 5.1.0
  cloud_firestore: 7.1.0
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
